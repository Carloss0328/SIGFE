<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
<title>Login - SIGFE</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    width:400px;
    border-radius:12px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#0b3d91;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0b3d91;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#072c6b;
}

.link{
    text-align:center;
    margin-top:15px;
}

a{
    text-decoration:none;
    color:#0b3d91;
}

</style>

</head>

<body>

<div class="card">

<h1>Iniciar Sesión</h1>

<form method="POST">


<input type="text" name="cedula" 
placeholder="Cédula o NIT"
required>
<input type="password" name="clave"
placeholder="Clave"
required>

<button type="submit">
Ingresar
</button>

</form>

<div class="link">
<a href="/registro">
¿No tienes cuenta? Regístrate
</a>
</div>

</div>

</body>
</html>
